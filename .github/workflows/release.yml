name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Choose the version
        id: version
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
            echo "This commit is already released."
            exit 0
          fi
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          version=$(node -e '
            const base = require("./package.json").version
            const latest = process.argv[1].replace(/^v/, "")
            const parse = (v) => v.split(".").map(Number)
            const newer = (a, b) => { for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] > b[i]; return false }
            if (!latest || newer(parse(base), parse(latest))) console.log(base)
            else { const [major, minor, patch] = parse(latest); console.log(`${major}.${minor}.${patch + 1}`) }
          ' "$latest")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - if: steps.version.outputs.version
        run: npm ci
      - if: steps.version.outputs.version
        run: npm test
      - if: steps.version.outputs.version
        name: Pack
        run: mv "$(npm pack --silent)" benedict.tgz
      - if: steps.version.outputs.version
        name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: gh release create "$TAG" benedict.tgz --target "$GITHUB_SHA" --title "$TAG" --generate-notes
